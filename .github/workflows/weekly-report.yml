name: Weekly financial report

on:
  schedule:
    - cron: '0 1 * * 5'
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger weekly report
        run: |
          curl -fsS -X POST "https://finance-bot-s4a5.onrender.com/api/cron/weekly-report" \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}"
